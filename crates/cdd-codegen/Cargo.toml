[package]
name = "cdd-codegen"
description = "Generates Rust tester and ECU-simulation code from CDD files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cdd-model = { version = "0.1.0", path = "../cdd-model" }
heck = "0.5.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3.0.6", features = ["full"] }

