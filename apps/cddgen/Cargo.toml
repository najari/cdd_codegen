[package]
name = "cddgen"
description = "Command line front end of the CDD to Rust generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
cdd-codegen = { version = "0.1.0", path = "../../crates/cdd-codegen" }
cdd-log = { version = "0.1.0", path = "../../crates/cdd-log" }
cdd-model = { version = "0.1.0", path = "../../crates/cdd-model" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "cddgen"
path = "src/main.rs"

